<style>
:root{--g1:#e4d4ff;--g2:#9d6be0;--g3:#5e3399;--bg:#f4eefc;--card:#fff;--tx:#1d1033;--mut:#7a6a99;--bd:rgba(157,107,224,.3);--ok:#2e9e63;--bad:#e05252;--gold:linear-gradient(135deg,#f1e8ff 0%,#b794f0 35%,#9a68e0 65%,#c9aaf7 100%)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--pat,none),radial-gradient(900px 400px at 50% -100px,rgba(157,107,224,.22),transparent),var(--bg);color:var(--tx);font:15px Inter,system-ui,sans-serif;font-variant-numeric:lining-nums;padding:0 12px 150px}

.fl{position:fixed;left:50%;transform:translateX(-50%);z-index:40;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s}

.card{position:relative}

.hero .mut{font-size:12px}

.it b{font-variant-numeric:tabular-nums}
#sf{scroll-margin-top:70px}
body.kp{padding-bottom:370px}

#kp.on{transform:none}
#kp .kd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}

#kp .kg{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,54px);gap:8px}

#kp .kg .z{grid-column:1/3}
.pul{animation:pul 1.8s ease-in-out infinite}
#n,#qt,#p{animation:pul 1.8s ease-in-out infinite}
@keyframes pul{0%,100%{border-color:var(--g2);box-shadow:0 0 0 0 rgba(157,107,224,.65),0 0 8px rgba(157,107,224,.35)}50%{border-color:#d9c2ff;box-shadow:0 0 0 6px rgba(157,107,224,0),0 0 18px rgba(190,150,245,.7)}}
.hero{position:sticky;top:var(--hh,52px);z-index:20}
.st b small{font-size:.72em;font-weight:700;margin-right:3px;opacity:.75}
.st b{white-space:nowrap}
#cnt{background:var(--gold);color:#1d1033;padding:3px 10px;border-radius:10px;font-size:13px;font-weight:800}
#hit{display:grid;gap:6px}
.hi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--g2);text-align:left}
.hi .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;min-width:0}
.hi .vl{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.chipm{padding:3px 10px;border-radius:10px;border:1px solid var(--g2);font-size:13px;font-weight:800;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<script>
const $=id=>document.getElementById(id),J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}},S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const M=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const K={c:'historico_compras_mensal',a:'historico_ticket_mensal',d:'historico_dinheiro_mensal',k:'catalogo_codigos_barras'};
const FILA='fila_fotos_ia',AC=()=>localStorage.auto_carrinho!='0';
const brl=n=>'R$ '+(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const SUG=['Arroz','Feijão Preto','Feijão Carioca','Açúcar','Café','Leite Integral','Leite Condensado','Creme de Leite','Biscoito','Óleo de Soja','Azeite','Macarrão','Molho de Tomate','Farinha de Trigo','Ovos','Manteiga','Pão Francês','Queijo Mussarela','Presunto','Iogurte','Peito de Frango','Carne Moída','Linguiça','Cebola','Alho','Tomate','Batata','Cenoura','Banana','Maçã','Detergente','Sabão em Pó','Amaciante','Água Sanitária','Papel Higiênico','Sabonete','Champô','Pasta de Dentes'];
const CATS=[['🥩 Carnes',/frango|carne|linguiça|salsicha|bacon|peixe|presunto/i],['🥛 Laticínios & Ovos',/leite|queijo|iogurte|manteiga|margarina|creme|ovos/i],['🥬 Hortifruti',/cebola|alho|tomate|batata|cenoura|alface|banana|maçã|laranja|limão|fruta|verdura/i],['🍞 Padaria',/pão|bolo|biscoito|bolacha/i],['🍚 Mercearia',/arroz|feij|açúcar|café|óleo|azeite|macarr|molho|extrato|farinha|achocolat/i],['🧴 Limpeza & Higiene',/deterg|sabão|sabonete|amacia|sanit|desinf|esponja|papel|champô|condic|dente|desodor/i]];
const cat=n=>(CATS.find(c=>c[1].test(n))||['🛒 Outros'])[0];
let sb=null;async function getSb(){if(sb)return sb;if(!navigator.onLine)return null;if(!window.supabase)await new Promise(r=>{const e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';e.onload=e.onerror=r;document.head.appendChild(e)});if(window.supabase)sb=supabase.createClient('https://jmeepzdvmmjngxwvayqb.supabase.co','sb_publishable_54ORrLbP7naW7n-KlKCdUA_hZnpjguH');return sb}
let mes=localStorage.ultimo_mes||M[new Date().getMonth()],ano=localStorage.ultimo_ano||''+new Date().getFullYear(),flt='todos',sel=new Set(),edit=null,ot,tt,pt,fq=0;
const key=()=>mes+'_'+ano,L=()=>J(K.c,{})[key()]||[];
const SL=l=>{const c=J(K.c,{});c[key()]=l;S(K.c,c);push()};
const tk=t=>t=='a'?K.a:K.d,B=t=>J(tk(t),{})[key()]||0;
const SB=(t,v)=>{const c=J(tk(t),{});c[key()]=v;S(tk(t),c);push()};

/* ---------- Toast ---------- */
function toast(m,i='✨',act,fn){const t=$('toast');$('ti').textContent=i;$('tt').innerHTML=esc(m)+(act?` <u id="ta">${act}</u>`:'');if(act)$('ta').onclick=()=>{fn();t.classList.remove('on')};t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),act?5000:2800)}
const beep=()=>{try{const x=new AudioContext(),o=x.createOscillator(),g=x.createGain();o.frequency.value=1800;g.gain.setValueAtTime(.15,x.currentTime);g.gain.exponentialRampToValueAtTime(.01,x.currentTime+.12);o.connect(g);g.connect(x.destination);o.start();o.stop(x.currentTime+.12)}catch{}navigator.vibrate&&navigator.vibrate(60)};

/* ---------- Modal ---------- */
const openM=h=>{$('mb').innerHTML=h;$('mo').classList.remove('hidden','sheet')},closeM=()=>{$('mo').classList.add('hidden');$('mo').classList.remove('sheet')};
const ask=(t,m,fn)=>{openM(`<h3>${t}</h3><p class="mut" style="font-size:13px">${m}</p><div class="row"><button class="ib" style="flex:1" onclick="closeM()">Não</button><button class="g" style="flex:1;background:var(--bad);color:#fff" id="yes">Sim</button></div>`);$('yes').onclick=()=>{closeM();fn()}};

/* ---------- Nuvem ---------- */

$('ean').value=c;if(n){$('n').value=n;beep();toast('Encontrado: '+n,'✅');autoPreco();$('qt').focus();$('qt').select()}else{$('n').value='';$('n').placeholder='Código '+c+' – digite o nome (fica salvo)';$('n').focus();toast('Não encontrado. Digite o nome uma vez.','✏️')}}

 else{await new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://unpkg.com/@zxing/library@0.21.3';s.onload=ok;s.onerror=ko;document.head.appendChild(s)});zx=new ZXing.BrowserMultiFormatReader();zx.decodeFromVideoElement(v,r=>{if(r&&run){run=false;lido(r.getText())}})}}
 catch{toast('Não foi possível usar a câmera','⚠️');stopCam()}}

/* IA de foto: tenta vários modelos e mostra o erro real na tela */
const MODELOS=['gemini-2.5-flash','gemini-2.0-flash','gemini-flash-latest'];
const errM=t=>openM(`<h3>⚠️ Erro da IA</h3><p class="mut" style="font-size:12px;word-break:break-word;white-space:pre-wrap">${esc(t)}</p><button class="g" onclick="closeM()">OK</button>`);
async function gem(parts){const k=(localStorage.gemini_api_key||'').trim(),er=[];
 for(const m of MODELOS){try{
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(k)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}]})}),d=await r.json();
  if(d.error){er.push(m+': '+d.error.message);continue}
  const t=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(x=>x.text||'').join('');
  if(t)return t;er.push(m+': resposta vazia'+(d.promptFeedback?' ('+JSON.stringify(d.promptFeedback)+')':''))}catch(e){er.push(m+': '+e.message+' (sem conexão com o Google?)')}}
 throw new Error(er.join('\n'))}
async function iaFoto(b){const t=await gem([{text:'Identifique o produto de supermercado na foto. Responda somente JSON: {"produto":"nome com marca e tamanho","preco":null ou número se houver etiqueta de preço visível}.'},{inlineData:{mimeType:'image/jpeg',data:b}}]),j=t.match(/\{[\s\S]*\}/);if(!j)throw new Error('Resposta inesperada da IA: '+t.slice(0,150));return JSON.parse(j[0])}
async function testarIA(){const k=$('gk').value.trim();if(!k)return toast('Cole a chave primeiro','ℹ️');localStorage.gemini_api_key=k;if(!navigator.onLine)return errM('Sem internet no aparelho.');toast('Testando a chave…','⏳');try{await gem([{text:'Responda só: ok'}]);toast('Chave funcionando!','✅')}catch(e){errM(e.message)}}
async function foto(){const v=$('vd');if(!v||v.readyState<2)return;beep();const c=$('cv'),w=Math.min(1024,v.videoWidth);c.width=w;c.height=Math.floor(w*v.videoHeight/v.videoWidth);c.getContext('2d').drawImage(v,0,0,c.width,c.height);const b=c.toDataURL('image/jpeg',.8).split(',')[1];stopCam();
 if(!localStorage.gemini_api_key)return toast('Cole a chave Gemini em ⚙️ para a IA ler a foto','ℹ️');
 if(!navigator.onLine){const f=J(FILA,[]);f.push({b,mes,ano});try{S(FILA,f);toast('Sem internet: foto guardada. A IA identifica quando voltar','📥')}catch{toast('Sem espaço para guardar a foto','⚠️')}return}
 toast('IA analisando a foto…','✨');
 try{const p=await iaFoto(b);if(p.produto){$('n').value=p.produto;p.preco&&($('p').value=String(p.preco).replace('.',','));beep();toast('IA: '+p.produto,'✨');autoPreco();$('qt').focus();$('qt').select()}else toast('A IA não reconheceu o produto','ℹ️')}catch(e){errM(e.message)}}
async function processaFila(){const f=J(FILA,[]);if(fq||!f.length||!localStorage.gemini_api_key||!navigator.onLine)return;fq=1;const resto=[];let n=0;
 for(const x of f){try{const p=await iaFoto(x.b);if(p.produto){const c=J(K.c,{}),k=x.mes+'_'+x.ano,l=c[k]||[];l.push({id:Date.now()+n,nome:p.produto,qtd:1,preco:+p.preco||lastPrice(p.produto),ean:null,comprado:AC()});c[k]=l;S(K.c,c);n++}}catch{resto.push(x)}}
 S(FILA,resto);fq=0;if(n){push();render();toast(n+' foto(s) identificada(s) e adicionada(s)','✨')}}

function ouvir(R){const r=rec=new R();r.lang='pt-BR';r.interimResults=false;r.continuous=true;r.maxAlternatives=1;
 r.onstart=()=>{$('mic').style.filter='brightness(1.4) drop-shadow(0 0 8px #d9c2ff)'};
 r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)e.results[i].isFinal&&falar(e.results[i][0].transcript)};
 r.onerror=e=>{const m={'not-allowed':'O microfone está bloqueado ou não funciona com o arquivo aberto direto do aparelho.','service-not-allowed':'O reconhecimento de voz não funciona com o arquivo aberto direto do aparelho.','network':'A voz precisa de internet.','audio-capture':'Nenhum microfone encontrado.'}[e.error];if(m){micOn=false;vozManual(m)}};
 r.onend=()=>{rec=null;micOn?setTimeout(()=>micOn&&ouvir(R),250):$('mic').style.filter=''};
 try{r.start()}catch{rec=null;micOn=false;vozManual('Não consegui ligar o microfone.')}}
const canon=n=>{const lo=n.toLowerCase(),c=[lo,lo.replace(/s$/,''),lo.replace(/es$/,'')],f=[...SUG,...Object.values(J(K.k,{}))].find(b=>c.includes(b.toLowerCase()));return f||n[0].toUpperCase()+n.slice(1)};
const STOPR=/n[aã]o quero mais( falar)?|parar|para de ouvir|chega|terminei|pronto|desligar|encerrar|fim da lista/g;
const W=x=>new Set(x.split(' '));
const LEAD=W('eu a o as os preciso precisa precisamos precisar quero queria querer falta faltando faltou faltam acabou acabaram comprar compra vou vamos tenho tem que com esse esses essa essas pra para mais também tô to estou está estamos de do da dos das e então aí ai só ainda adiciona adicionar coloca colocar bota botar põe anota anotar pegar leva levar lá aqui tipo gente'),
 TRAIL=W('né mais também tá ta ok favor aí ai então pra para de e do da'),
 FILL=W('ah ahn ahh é hum hm hmm né tipo enfim então aí ai bom olha tá ta ok ó ué ei tchau'),
 BL=W('não nao nada falar falando microfone obrigado obrigada alô teste testando deixa esquece esqueça errei cancelar'),
 NUM={um:1,uma:1,dois:2,duas:2,três:3,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,quinze:15,vinte:20},
 isn=x=>/^\d+(\.\d+)?$/.test(String(x));
function limpa(seg){let tk=seg.toLowerCase().replace(/(^|\s)com\s+ess[ea]s?(?=\s|$)/g,' ').replace(/(\d+),(\d+)/g,'$1.$2').replace(/r\$/g,' real ').split(/\s+/).filter(Boolean);
 const hasR=tk.some(x=>x=='real'||x=='reais');
 tk=tk.filter(x=>!['real','reais','quantidade','por'].includes(x)&&!FILL.has(x));
 while(tk.length&&LEAD.has(tk[0]))tk.shift();
 while(tk.length&&TRAIL.has(tk[tk.length-1]))tk.pop();
 tk=tk.map(w=>NUM.hasOwnProperty(w)?NUM[w]:w);
 tk=tk.filter((x,i)=>!(x=='de'&&i&&isn(tk[i-1])));
 if(tk.some(x=>BL.has(x)))return null;
 const nums=tk.filter(isn).map(Number),nome=tk.filter(x=>!isn(x)).join(' ');
 if(!nome||nome.split(' ').length>5)return null;
 return{nome,nums,hasR,lead:isn(tk[0])}}
function buscaVoz(nm){kpHide();reset();$('n').value=nm;const low=nm.toLowerCase(),pend=L().filter(i=>!i.comprado&&i.nome.toLowerCase().includes(low)),ex=pend.find(i=>i.nome.toLowerCase()==low)||(pend.length==1?pend[0]:null);if(ex)return hit(ex.id);hits();if(!L().some(i=>i.nome.toLowerCase().includes(low))){autoPreco();nx({key:'Enter',preventDefault(){}},'qt')}else toast('Toque no item para dar o valor','👆')}
function falar(t){if(!t||!t.trim())return;let x=t.toLowerCase();const parar=x.search(STOPR)>=0;x=x.replace(STOPR,' ');const l=L(),add=[];let busca=null;
 x.split(/;|\.(?!\d)|,(?!\d)| e (?=\S)/).forEach((seg,k)=>{const o=limpa(seg);if(!o)return;const{nome,nums,hasR}=o;let q=1,pr=0,qs=false;
  if(nums.length>=2){q=nums[0];pr=nums[1];qs=true}else if(nums.length==1){const v=nums[0];if(hasR||!Number.isInteger(v))pr=v;else if(o.lead||MODO()=='casa'){q=v;qs=true}else pr=v}
  const nm=canon(nome);
  if(MODO()=='mercado'&&!pr){busca=nm;return}
  const ex=l.find(i=>i.nome.toLowerCase()==nm.toLowerCase());
  if(ex){qs&&(ex.qtd=q);pr&&(ex.preco=pr);MODO()=='mercado'&&AC()&&pr&&(ex.comprado=true)}else l.push({id:Date.now()+k,nome:nm,qtd:q,preco:pr||lastPrice(nm),ean:null,comprado:MODO()=='mercado'&&AC()});
  add.push(nm+(q>1?' ×'+q:''))});
 if(add.length){SL(l);render();toast('Adicionado: '+add.join(', '),'🎤')}
 if(busca)buscaVoz(busca);
 if(parar)stopMic()}
function zap(){const l=L();if(!l.length)return toast('Lista vazia','⚠️');const o=B('a')+B('d');let g=0,c=0;l.forEach(i=>{g+=i.qtd*i.preco;i.comprado&&(c+=i.qtd*i.preco)});window.open('https://wa.me/?text='+encodeURIComponent(`🛒 *Lista de Compras (${mes}/${ano})*\n\n`+l.map(i=>`${i.comprado?'✅':'▫️'} ${i.nome} (${i.qtd}x) - ${brl(i.qtd*i.preco)}`).join('\n')+`\n\n💰 *Previsto:* ${brl(g)}\n🧺 *Carrinho:* ${brl(c)}\n✨ *Restante:* ${brl(o-g)}`),'_blank')}
