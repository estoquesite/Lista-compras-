<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link id="pwa-manifest" rel="manifest" href="data:application/manifest+json;charset=utf-8,{
        %22name%22: %22Lista de Compras%22,
        %22short_name%22: %22Compras%22,
        %22start_url%22: %22.%22,
        %22display%22: %22standalone%22,
        %22background_color%22: %22%23f9f9f9%22,
        %22theme_color%22: %22%232563eb%22,
        %22icons%22: [{%22src%22: %22https://cdn-icons-png.flaticon.com/512/1170/1170678.png%22, %22sizes%22: %22512x512%22, %22type%22: %22image/png%22}]
    }">
</head>
<body class="bg-blue-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 p-4 pb-28">
    <div class="max-w-md mx-auto space-y-4">
        <header class="text-center py-4 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-blue-100 dark:border-gray-700">
            <h1 class="text-lg font-black text-blue-700 dark:text-blue-400 uppercase tracking-wide">🛒 Minha Lista de Compras</h1>
        </header>

        <!-- Painel Adicionar Item -->
        <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm space-y-3 border border-gray-100 dark:border-gray-700 flex gap-2">
            <input type="text" id="itemCompra" placeholder="Adicionar item..." class="flex-1 text-xs p-2.5 bg-gray-50 dark:bg-gray-900 border rounded-xl">
            <button onclick="adicionarItemCompra()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 rounded-xl text-xs transition">
                + Adicionar
            </button>
        </div>

        <!-- Lista -->
        <div id="listaCompras" class="space-y-2"></div>
    </div>

    <!-- Barra Inferior Fixa -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 px-4 py-2 flex justify-between items-center max-w-md mx-auto rounded-t-2xl shadow-lg">
        <button onclick="document.documentElement.classList.toggle('dark')" class="px-3 py-1.5 rounded-xl bg-gray-100 dark:bg-gray-800 text-xs font-semibold">🌙/☀️</button>
        <button onclick="instalarApp()" class="px-3 py-1.5 rounded-xl bg-blue-100 dark:bg-blue-950 text-blue-800 dark:text-blue-300 text-xs font-bold">📱 Instalar App</button>
    </div>

    <script>
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });

        function instalarApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
            } else {
                alert("📱 Para instalar no celular, toque nas opções do navegador e selecione 'Adicionar à tela inicial'.");
            }
        }

        function adicionarItemCompra() {
            const item = document.getElementById('itemCompra').value.trim();
            if(!item) return;

            const lista = document.getElementById('listaCompras');
            const div = document.createElement('div');
            div.className = "bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm border border-blue-100 dark:border-gray-700 flex justify-between items-center text-xs font-bold";
            div.innerHTML = `<label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" onchange="this.nextElementSibling.classList.toggle('line-through', this.checked)" class="w-4 h-4 accent-blue-600"><span>${item.toUpperCase()}</span></label><button onclick="this.parentElement.remove()" class="text-red-500 px-2">✕</button>`;
            lista.appendChild(div);
            document.getElementById('itemCompra').value = '';
        }
    </script>
</body>
</html>
