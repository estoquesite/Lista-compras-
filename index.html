<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lista de Compras Premium</title>
<meta name="theme-color" content="#0c0a06">
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1170/1170576.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#f6e27a;--g2:#d4a017;--g3:#8a6410;--bg:#faf6ec;--card:#fff;--tx:#241c0a;--mut:#8b7d5c;--bd:rgba(212,160,23,.28);--ok:#2e9e63;--bad:#e05252;--gold:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3))}
.dark{--bg:#0c0a06;--card:#17130b;--tx:#f6efd8;--mut:#a89970;--bd:rgba(212,160,23,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--pat,none),radial-gradient(900px 400px at 50% -100px,rgba(212,160,23,.18),transparent),var(--bg);color:var(--tx);font:14px Inter,system-ui,sans-serif;padding:0 12px 150px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%;outline:0;min-width:0}
input:focus,select:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(212,160,23,.18)}
.hidden{display:none!important}
.w{max-width:720px;margin:0 auto}
.card{background:color-mix(in srgb,var(--card) 90%,transparent);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-top:12px}
.row{display:flex;align-items:center;gap:8px}
.sp{justify-content:space-between}
.g{background:var(--gold);color:#241c0a;font-weight:700;border-radius:12px;padding:10px 14px;box-shadow:0 6px 18px rgba(212,160,23,.3)}
.g:active,.ib:active{transform:scale(.95)}
.ib{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--bd);flex:none}
h1{font:800 22px 'Playfair Display',Georgia,serif;margin:0;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.mut{color:var(--mut);font-size:11px}
header{position:sticky;top:0;z-index:30;padding:10px 0;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 82%,transparent)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st>div{background:color-mix(in srgb,var(--card) 90%,transparent);border:1px solid var(--bd);border-radius:16px;padding:9px 10px}
.st b{display:block;font:800 15px 'Playfair Display',Georgia,serif;margin-top:2px}
.hero{background:var(--gold);border:0;color:#241c0a;text-align:center;box-shadow:0 10px 30px rgba(212,160,23,.35)}
.hero b{color:#241c0a}.hero .mut{color:#5a4410}.hero .bad{color:#b3261e}.hero .bar{background:rgba(36,28,10,.2)}.hero .bar i{background:#241c0a}.hero .bar.over i{background:#b3261e}
.bar{height:6px;border-radius:9px;background:rgba(212,160,23,.18);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .5s}
.bar.over i{background:var(--bad)}
.cat{font:700 12px Inter;color:var(--g2);margin:14px 2px 4px}
.it{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--bd)}
.it.ok .nm{text-decoration:line-through;opacity:.45}
.it .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid{flex:1;min-width:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--g2);flex:none;display:grid;place-items:center;font-size:13px}
.it.ok .chk{background:var(--gold)}
.qs{display:flex;align-items:center;gap:2px;font-size:12px}
.qs button{width:24px;height:24px;border-radius:8px;background:var(--bg);border:1px solid var(--bd)}
input[type=checkbox]{width:17px;height:17px;padding:0;accent-color:var(--g2);flex:none}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:12px}
.tabs button{padding:5px 9px;border-radius:9px;font-size:12px;color:var(--mut)}
.tabs .on{background:var(--gold);color:#241c0a;font-weight:700}
.fl{position:fixed;left:50%;transform:translateX(-50%);z-index:40;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s}
.fl.off{transform:translate(-50%,160%);opacity:0;pointer-events:none}
#dock{bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:26px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(18px);border:1px solid var(--bd);box-shadow:0 14px 40px rgba(0,0,0,.35),0 0 0 1px rgba(212,160,23,.12)}
#dock .ib{border:0;background:transparent;font-size:18px}
#mic{width:54px;height:54px;border-radius:50%;font-size:22px;margin:-22px 2px 0;background:var(--gold);box-shadow:0 8px 24px rgba(212,160,23,.55)}
#pill{bottom:92px;padding:8px 16px;border-radius:20px;background:var(--gold);color:#241c0a;border:0;font-weight:700;font-size:12px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);z-index:90;background:var(--card);color:var(--tx);border:1px solid var(--g2);padding:10px 14px;border-radius:16px;font-size:12px;display:flex;gap:10px;align-items:center;transition:transform .35s;max-width:92vw}
#toast.on{transform:translate(-50%,0)}
#toast u{color:var(--g1);cursor:pointer;font-weight:700}
.mo{position:fixed;inset:0;z-index:60;background:rgba(5,4,2,.78);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:20px;width:100%;max-width:380px;max-height:88vh;overflow:auto;display:grid;gap:12px}
.box h3{margin:0;font:800 18px 'Playfair Display',Georgia,serif}
#login{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 0,var(--card),var(--bg) 75%);display:grid;place-items:center;padding:20px}
#login .box{text-align:center}
#login input{text-align:center;letter-spacing:6px}
.chart{display:flex;align-items:flex-end;gap:5px;height:110px}
.chart div{flex:1;text-align:center;font-size:9px;color:var(--mut)}
.chart i{display:block;background:var(--gold);border-radius:6px 6px 0 0;min-height:2px;margin-bottom:3px}
video{width:100%;border-radius:16px;background:#000;aspect-ratio:4/3;object-fit:cover}
#bgc{position:fixed;inset:0;z-index:-1;pointer-events:none}
html::after{content:'';position:fixed;inset:7px;border-radius:22px;pointer-events:none;z-index:55}
.bd-linha::after{border:2px solid var(--g2)}
.bd-dupla::after{border:5px double var(--g2)}
.bd-brilho::after{border:2px solid var(--g1);box-shadow:0 0 18px rgba(212,160,23,.6),inset 0 0 18px rgba(212,160,23,.35)}
.bd-grad::after{border:4px solid transparent;background:var(--gold) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.mo.sheet{align-items:flex-end;background:transparent;backdrop-filter:none;pointer-events:none}
.mo.sheet .box{pointer-events:auto;max-width:520px;max-height:62vh;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.sw,.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--bd)}
.chips button{padding:6px 10px;border-radius:10px;border:1px solid var(--bd);font-size:12px}
.sw .on{box-shadow:0 0 0 3px var(--g2)}.chips .on{background:var(--gold);color:#241c0a;font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="bgc"></canvas>
<div id="toast"><span id="ti">✨</span><span id="tt"></span></div>

<div id="login"><div class="box" style="max-width:300px">
<div style="font-size:38px">🛒</div><h3 style="color:var(--g2)">Acesso seguro</h3>

</div></div>

<div id="app" class="w hidden">
<header>
 <div class="row sp">
  <div><h1>Lista de Compras</h1><span id="net" class="mut">● Online</span></div>
  <div class="row">
   <button class="ib" title="Nuvem" onclick="syncManual()">☁️</button>
   <button class="ib" title="Relatório" onclick="relat()">📊</button>
   <button class="ib" title="Backup / Juntar" onclick="backup()">💾</button>
   <button class="ib" title="Ajustes" onclick="cfg()">⚙️</button>
  </div>
 </div>
 <div class="row" style="margin-top:8px"><select id="fm" onchange="per()"></select><select id="fa" onchange="per()" style="width:100px"></select></div>
</header>

<div class="st" style="margin-top:6px">
 <div onclick="orc('a')"><span class="mut">💳 Alelo ✏️</span><b id="sa"></b></div>
 <div onclick="orc('d')"><span class="mut">💵 Espécie ✏️</span><b id="sd"></b></div>
 <div><span class="mut">∑ Orçado</span><b id="so"></b></div>
</div>

<section class="card hero">
 <div class="st" style="gap:0">
  <div style="background:none;border:0"><span class="mut">No carrinho</span><b id="tc"></b></div>
  <div style="background:none;border:0"><span class="mut">Previsto</span><b id="tg"></b></div>
  <div style="background:none;border:0"><span class="mut">Restante</span><b id="tr"></b></div>
 </div>
 <div class="bar" id="bar"><i></i></div>
</section>

<section class="card" id="sf">
 <div class="mut" id="ft" style="margin-bottom:8px">Adicionar produto</div>
 <form id="f" onsubmit="save(event)" style="display:grid;gap:8px">
  <input type="hidden" id="ean">
  <div class="row"><input id="n" list="sug" required autocomplete="off" placeholder="Produto (ex.: arroz, café…)" onchange="autoPreco()"><datalist id="sug"></datalist>
   <button type="button" class="ib" onclick="buscar()">🔍</button><button type="button" class="ib" onclick="scan()">📷</button></div>
  <div class="row"><input id="qt" type="number" step="any" min="0.1" value="1" style="width:25%;text-align:center"><input id="p" type="number" step="0.01" min="0" placeholder="R$ 0,00" style="text-align:center">
   <button class="g" id="bs" style="flex:none">➕ Salvar</button><button type="button" id="bc" class="ib hidden" onclick="reset()">✕</button></div>
 </form>
</section>

<section class="card">
 <div class="row sp" style="flex-wrap:wrap">
  <label class="row"><input type="checkbox" id="all" onchange="selAll(this.checked)"><b id="prog" style="font-size:12px"></b></label>
  <div class="row"><button id="del" class="g hidden" style="padding:5px 10px;font-size:12px;background:var(--bad);color:#fff" onclick="delSel()"></button>
   <div class="tabs" id="tabs"><button class="on" data-f="todos">Todos</button><button data-f="pend">Pendentes</button><button data-f="ok">Carrinho</button></div></div>
 </div>
 <input id="q" oninput="render()" placeholder="🔍 Filtrar na lista…" style="margin-top:10px">
 <div id="list"></div>
 <button class="mut" style="margin-top:10px;color:var(--bad)" onclick="zerar()">Zerar este mês</button>
</section>
</div>

<div id="mo" class="mo hidden" onclick="if(event.target==this)closeM()"><div class="box" id="mb"></div></div>

<div id="pill" class="fl"></div>
<nav id="dock" class="fl">
 <button class="ib" onclick="fundoM()">🎨</button>
 <button class="ib" onclick="scan()">📷</button>
 <button id="mic" class="ib" onclick="voz()">🎤</button>
 <button class="ib" onclick="zap()">💬</button>
 <button class="ib" onclick="lock()">🔒</button>
</nav>
<canvas id="cv" class="hidden"></canvas>

<script>
const $=id=>document.getElementById(id),J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}},S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const M=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const K={c:'historico_compras_mensal',a:'historico_ticket_mensal',d:'historico_dinheiro_mensal',k:'catalogo_codigos_barras'};
const brl=n=>'R$ '+(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const SUG=['Arroz','Feijão Preto','Feijão Carioca','Açúcar','Café','Leite Integral','Leite Condensado','Creme de Leite','Biscoito','Óleo de Soja','Azeite','Macarrão','Molho de Tomate','Farinha de Trigo','Ovos','Manteiga','Pão Francês','Queijo Mussarela','Presunto','Iogurte','Peito de Frango','Carne Moída','Linguiça','Cebola','Alho','Tomate','Batata','Cenoura','Banana','Maçã','Detergente','Sabão em Pó','Amaciante','Água Sanitária','Papel Higiênico','Sabonete','Champô','Pasta de Dentes'];
const CATS=[['🥩 Carnes',/frango|carne|linguiça|salsicha|bacon|peixe|presunto/i],['🥛 Laticínios & Ovos',/leite|queijo|iogurte|manteiga|margarina|creme|ovos/i],['🥬 Hortifruti',/cebola|alho|tomate|batata|cenoura|alface|banana|maçã|laranja|limão|fruta|verdura/i],['🍞 Padaria',/pão|bolo|biscoito|bolacha/i],['🍚 Mercearia',/arroz|feij|açúcar|café|óleo|azeite|macarr|molho|extrato|farinha|achocolat/i],['🧴 Limpeza & Higiene',/deterg|sabão|sabonete|amacia|sanit|desinf|esponja|papel|champô|condic|dente|desodor/i]];
const cat=n=>(CATS.find(c=>c[1].test(n))||['🛒 Outros'])[0];
let sb=null;async function getSb(){if(sb)return sb;if(!navigator.onLine)return null;if(!window.supabase)await new Promise(r=>{const e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';e.onload=e.onerror=r;document.head.appendChild(e)});if(window.supabase)sb=supabase.createClient('https://jmeepzdvmmjngxwvayqb.supabase.co','sb_publishable_54ORrLbP7naW7n-KlKCdUA_hZnpjguH');return sb}
let mes=localStorage.ultimo_mes||M[new Date().getMonth()],ano=localStorage.ultimo_ano||''+new Date().getFullYear(),flt='todos',sel=new Set(),edit=null,ot,tt,pt;
const key=()=>mes+'_'+ano,L=()=>J(K.c,{})[key()]||[];
const SL=l=>{const c=J(K.c,{});c[key()]=l;S(K.c,c);push()};
const tk=t=>t=='a'?K.a:K.d,B=t=>J(tk(t),{})[key()]||0;
const SB=(t,v)=>{const c=J(tk(t),{});c[key()]=v;S(tk(t),c);push()};

/* ---------- Toast ---------- */
function toast(m,i='✨',act,fn){const t=$('toast');$('ti').textContent=i;$('tt').innerHTML=esc(m)+(act?` <u id="ta">${act}</u>`:'');if(act)$('ta').onclick=()=>{fn();t.classList.remove('on')};t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),act?5000:2800)}
const beep=()=>{try{const x=new AudioContext(),o=x.createOscillator(),g=x.createGain();o.frequency.value=1800;g.gain.setValueAtTime(.15,x.currentTime);g.gain.exponentialRampToValueAtTime(.01,x.currentTime+.12);o.connect(g);g.connect(x.destination);o.start();o.stop(x.currentTime+.12)}catch{}navigator.vibrate&&navigator.vibrate(60)};

/* ---------- Modal ---------- */
const openM=h=>{$('mb').innerHTML=h;$('mo').classList.remove('hidden','sheet')},closeM=()=>{$('mo').classList.add('hidden');$('mo').classList.remove('sheet')};
const ask=(t,m,fn)=>{openM(`<h3>${t}</h3><p class="mut" style="font-size:13px">${m}</p><div class="row"><button class="ib" style="flex:1" onclick="closeM()">Não</button><button class="g" style="flex:1;background:var(--bad);color:#fff" id="yes">Sim</button></div>`);$('yes').onclick=()=>{closeM();fn()}};

/* ---------- Nuvem ---------- */
function push(){localStorage.precisa_sync='1';clearTimeout(pt);pt=setTimeout(up,700)}
async function up(){if(!await getSb())return;try{const{error}=await sb.from('app_dados_compras').upsert({id:'1',conteudo:{historico_compras:J(K.c,{}),historico_ticket:J(K.a,{}),historico_dinheiro:J(K.d,{}),catalogo_codigos:J(K.k,{})}});if(!error){localStorage.removeItem('precisa_sync');net()}}catch{}}
async function down(){if(!await getSb())return;try{if(localStorage.precisa_sync)await up();const{data}=await sb.from('app_dados_compras').select('conteudo').eq('id','1').single();const c=data&&data.conteudo;if(c){c.historico_compras&&S(K.c,c.historico_compras);c.historico_ticket&&S(K.a,c.historico_ticket);c.historico_dinheiro&&S(K.d,c.historico_dinheiro);c.catalogo_codigos&&S(K.k,c.catalogo_codigos)}else await up()}catch{}}
async function syncManual(){if(!navigator.onLine)return toast('Você está offline','⚠️');await down();render();sugest();toast('Sincronizado com a nuvem','✅')}
function net(){const n=$('net'),on=navigator.onLine;n.textContent=on?(localStorage.precisa_sync?'● Online · sincronizando…':'● Online'):'● Offline · salvando no aparelho';n.style.color=on?'var(--ok)':'#e0a030';if(on&&localStorage.precisa_sync)up()}
addEventListener('online',net);addEventListener('offline',net);

/* ---------- Acesso ---------- */
const PIN=()=>localStorage.pin_app||'1234';
function err(m){$('err').textContent=m}
function pinGo(){$('pin').value==PIN()?($('pin').value='',enter()):err('PIN incorreto.')}
async function enter(){sessionStorage.auth='1';await down();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('fm').value=mes;$('fa').value=ano;render();sugest();net();wake()}
function lock(){sessionStorage.removeItem('auth');$('app').classList.add('hidden');$('login').classList.remove('hidden')}
async function bio(){try{if(!window.PublicKeyCredential||!await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())return err('Biometria indisponível. Use o PIN.');const ch=crypto.getRandomValues(new Uint8Array(32));let c;if(localStorage.bio){try{c=await navigator.credentials.get({publicKey:{challenge:ch,allowCredentials:[{id:Uint8Array.from(atob(localStorage.bio),x=>x.charCodeAt(0)),type:'public-key'}],userVerification:'required'}})}catch{}}
if(!c){c=await navigator.credentials.create({publicKey:{challenge:ch,rp:{name:'Compras'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'user',displayName:'Usuário'},pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'}}});localStorage.bio=btoa(String.fromCharCode(...new Uint8Array(c.rawId)))}c&&enter()}catch(e){e.name!='NotAllowedError'&&err('Falha biométrica. Use o PIN.')}}

/* ---------- Período ---------- */
function per(){mes=$('fm').value;ano=$('fa').value;localStorage.ultimo_mes=mes;localStorage.ultimo_ano=ano;sel.clear();reset();render()}
(()=>{$('fm').innerHTML=M.map(m=>`<option>${m}</option>`).join('');const y=new Date().getFullYear();for(let a=y-1;a<=y+2;a++)$('fa').innerHTML+=`<option>${a}</option>`})();
/* ---------- Fundos ---------- */
const CORES={marfim:['#faf6ec','#ffffff','#241c0a',0],champanhe:['#f1e2b8','#fff8e1','#2b2108',0],rosé:['#f7e1dc','#fff5f3','#3a1f1a',0],menta:['#dff0e4','#f5fcf7','#14301f',0],gelo:['#e2ecf7','#f7fbff','#13263a',0],lavanda:['#eae3f6','#faf7ff','#2a1f3d',0],grafite:['#2b2a28','#383633','#f4efe2',1],preto:['#0c0a06','#17130b','#f6efd8',1]};
const mk=(w,h,b)=>encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}'>${b}</svg>`),G=`stroke='#d4a017' stroke-opacity='.4' fill='none'`;
const PAT={pontos:mk(24,24,`<circle cx='4' cy='4' r='1.6' fill='#d4a017' fill-opacity='.45'/>`),losangos:mk(44,44,`<path d='M22 3L41 22 22 41 3 22z' ${G}/>`),bolhas:mk(90,90,`<circle cx='22' cy='24' r='15' ${G}/><circle cx='64' cy='60' r='10' ${G}/><circle cx='70' cy='16' r='4' fill='#d4a017' fill-opacity='.4'/><circle cx='20' cy='72' r='5' ${G}/>`),hex:mk(52,60,`<path d='M26 3l22 13v26L26 55 4 42V16z' ${G}/>`),ondas:mk(64,24,`<path d='M0 12Q16 0 32 12T64 12' ${G}/>`)};
const FD={cor:'marfim',borda:'',forma:'',anim:''};let rt,mx=-999,my=-999,raf,ax=.5,ay=.4;

 h.style.setProperty('--bg',c[0]);h.style.setProperty('--card',c[1]);h.style.setProperty('--tx',c[2]);h.classList.toggle('dark',!!c[3]);

toast('Usando o nome digitado','ℹ️');$('p').focus()}
