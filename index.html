<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lista de Compras Premium</title>
<meta name="theme-color" content="#8b3dff">
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1170/1170576.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#8b3dff;--card:#ffffff;--tx:#1d1033;--g2:var(--bg);--g1:color-mix(in srgb,var(--bg) 45%,#fff);--fld:color-mix(in srgb,var(--bg) 9%,#fff);--mut:#54427a;--bd:color-mix(in srgb,var(--bg) 40%,transparent);--ok:#12b76a;--bad:#e5365a;--glow:0 0 10px color-mix(in srgb,var(--bg) 55%,transparent);--gold:linear-gradient(135deg,color-mix(in srgb,var(--bg) 60%,#ff5fd0),var(--bg) 55%,color-mix(in srgb,var(--bg) 80%,#000))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--pat,none),radial-gradient(700px 420px at 15% -60px,rgba(255,255,255,.4),transparent),radial-gradient(700px 600px at 100% 100%,color-mix(in srgb,var(--bg) 55%,#ff4fd8),transparent),var(--bg);color:var(--tx);font:16px Inter,system-ui,sans-serif;font-variant-numeric:lining-nums;padding:0 12px 150px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;font-size:16px;color:var(--tx);background:var(--fld);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%;outline:0;min-width:0}
input:focus,select:focus{border-color:var(--g1);box-shadow:0 0 0 2px color-mix(in srgb,var(--bg) 35%,transparent)}
.hidden{display:none!important}
.w{max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--g2);border-radius:20px;padding:14px;margin-top:12px;box-shadow:0 6px 20px rgba(0,0,0,.12),var(--glow)}
.row{display:flex;align-items:center;gap:8px}
.sp{justify-content:space-between}
.g{background:var(--gold);color:#fff;font-weight:800;border-radius:12px;padding:10px 14px;box-shadow:0 4px 14px color-mix(in srgb,var(--bg) 55%,transparent)}
.g:active,.ib:active{transform:scale(.95)}
.ib{width:38px;height:38px;border-radius:12px;background:var(--fld);border:1px solid var(--g2);flex:none}
h1{font:800 22px Inter,system-ui,sans-serif;margin:0;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.25)}
header .mut{color:#fff}
.mut{color:var(--mut);font-size:13px;font-weight:700}
header{position:sticky;top:0;z-index:30;padding:10px 14px;margin:0 -12px;background:var(--gold);box-shadow:0 4px 18px rgba(0,0,0,.25);border-radius:0 0 22px 22px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st>div{background:var(--fld);border:1px solid var(--bd);border-radius:16px;padding:8px 6px}
.st b{display:block;font:800 clamp(12px,3.7vw,15px) Inter,system-ui,sans-serif;font-variant-numeric:lining-nums tabular-nums;margin-top:3px}
.hero{background:var(--gold);border:2px solid #fff;color:#fff;text-align:center;box-shadow:0 0 22px rgba(255,255,255,.55),0 8px 24px rgba(0,0,0,.2)}
.hero b{color:#fff}.hero .mut{color:#f6e6ff}.hero .bad{color:#ffd0d8}.hero .bar{background:rgba(255,255,255,.28)}.hero .bar i{background:#fff;box-shadow:0 0 10px #fff}.hero .bar.over i{background:#ff8aa0}
.bar{height:6px;border-radius:9px;background:rgba(192,77,255,.3);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .5s}
.bar.over i{background:var(--bad)}
.cat{font:800 13px Inter;color:#fff;background:var(--gold);display:inline-block;padding:5px 14px;border-radius:999px;margin:14px 2px 4px;box-shadow:0 3px 10px color-mix(in srgb,var(--bg) 45%,transparent)}
.it{display:flex;align-items:center;gap:8px;padding:10px 10px;margin:6px 0;background:var(--fld);border:1px solid var(--bd);border-radius:16px}
.it.ok{background:color-mix(in srgb,var(--ok) 16%,#fff);border-color:var(--ok)}
.it.ok .nm{text-decoration:line-through;opacity:.5}
.it .nm{font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid{flex:1;min-width:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--g2);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.it.ok .chk{background:var(--gold)}
.qs{display:flex;align-items:center;gap:2px;font-size:12px}
.qs button{width:24px;height:24px;border-radius:8px;background:var(--fld);border:1px solid var(--g2)}
input[type=checkbox]{width:17px;height:17px;padding:0;accent-color:var(--g2);flex:none}
.tabs{display:flex;gap:4px;background:var(--fld);padding:3px;border-radius:12px;border:1px solid var(--bd)}
.tabs button{padding:5px 9px;border-radius:9px;font-size:12px;color:var(--mut)}
.tabs .on{background:var(--gold);color:#fff;font-weight:800;box-shadow:0 2px 10px color-mix(in srgb,var(--bg) 55%,transparent)}
.fl{position:fixed;left:50%;transform:translateX(-50%);z-index:40;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s}
.fl.off{transform:translate(-50%,160%);opacity:0;pointer-events:none}
#dock{bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:26px;background:var(--card);border:1px solid var(--g2);box-shadow:0 0 16px color-mix(in srgb,var(--bg) 60%,transparent),0 10px 30px rgba(0,0,0,.25)}
#dock .ib{border:0;background:transparent;box-shadow:none;font-size:18px}
#dock .ib.offon{background:var(--gold);box-shadow:0 0 12px var(--g2)}
#dock #mic{width:54px;height:54px;border-radius:50%;font-size:22px;margin:-22px 2px 0;background:var(--gold);box-shadow:0 4px 18px color-mix(in srgb,var(--bg) 70%,transparent)}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);z-index:90;background:var(--card);color:var(--tx);border:1px solid var(--g2);padding:10px 14px;border-radius:16px;font-size:12px;display:flex;gap:10px;align-items:center;transition:transform .35s;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.on{transform:translate(-50%,0)}
#toast u{color:var(--g2);cursor:pointer;font-weight:700}
.mo{position:fixed;inset:0;z-index:60;background:rgba(20,10,40,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border:1px solid var(--g2);border-radius:24px;padding:20px;width:100%;max-width:380px;max-height:88vh;overflow:auto;display:grid;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.box h3{margin:0;font:800 19px Inter,system-ui,sans-serif}
#login{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 0,var(--card),var(--bg) 75%);display:grid;place-items:center;padding:20px}
#login .box{text-align:center}
#login input{text-align:center;letter-spacing:6px}
.chart{display:flex;align-items:flex-end;gap:5px;height:110px}
.chart div{flex:1;text-align:center;font-size:9px;color:var(--mut)}
.chart i{display:block;background:var(--gold);border-radius:6px 6px 0 0;min-height:2px;margin-bottom:3px;}
video{width:100%;border-radius:16px;background:#000;aspect-ratio:4/3;object-fit:cover}
#mesh{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#mesh i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(50px);opacity:.55;animation:blob 16s ease-in-out infinite alternate}
#mesh i:nth-child(1){background:#ff5fd0;top:-20vmax;left:-15vmax}
#mesh i:nth-child(2){background:#38d6ff;right:-25vmax;bottom:-20vmax;animation-delay:-6s}
@keyframes blob{to{transform:translate(12vmax,8vmax) scale(1.2)}}
.mesh-off #mesh{display:none}
.hero{overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(-100%);animation:shim 5s ease-in-out infinite;pointer-events:none}
@keyframes shim{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
#bgc{position:fixed;inset:0;z-index:25;pointer-events:none}
html::after{content:'';position:fixed;inset:7px;border-radius:22px;pointer-events:none;z-index:55}
.bd-linha::after{border:2px solid var(--g2)}
.bd-dupla::after{border:5px double var(--g2)}
.bd-brilho::after{border:1px solid #fff;box-shadow:0 0 10px #fff,0 0 18px var(--g2)}
.bd-grad::after{border:4px solid transparent;background:var(--gold) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.mo.sheet{align-items:flex-end;background:transparent;backdrop-filter:none;pointer-events:none}
.mo.sheet .box{pointer-events:auto;max-width:520px;max-height:62vh;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.sw,.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--bd)}
.chips button{padding:6px 10px;border-radius:10px;border:1px solid var(--bd);font-size:12px}
.sw .on{box-shadow:0 0 0 3px var(--g2)}.chips .on{background:var(--gold);color:#fff;font-weight:800}
.card{position:relative}
.hdl{position:absolute;top:0;left:50%;transform:translateX(-50%);width:64px;height:16px;font-size:20px;line-height:12px;touch-action:none;cursor:grab;opacity:.7;z-index:2}
.card.drag{z-index:50;box-shadow:0 14px 40px rgba(0,0,0,.4);outline:2px solid var(--g2)}
.hero .mut{font-size:12px}
.hero .st b{font-size:clamp(14px,4.3vw,17px);white-space:nowrap}
.hero b small{font-size:.7em;font-weight:700;margin-right:4px;opacity:.8}
.it b{font-variant-numeric:tabular-nums}
#sf{scroll-margin-top:70px}
body.kp{padding-bottom:370px}
#kp{position:fixed;left:0;right:0;bottom:0;z-index:45;margin:0 auto;max-width:520px;padding:10px 10px max(12px,env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--g2);border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.25);transform:translateY(110%);transition:transform .3s}
#kp.on{transform:none}
#kp .kd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
#kp .kd span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#kp .kd b{font:800 28px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
#kp .kg{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,54px);gap:8px}
#kp .kg button{border-radius:14px;background:var(--fld);border:1px solid var(--g2);font:700 24px Inter,system-ui,sans-serif}
#kp .kg button:active{transform:scale(.94)}
#kp .kg .go{grid-column:4;grid-row:2/5;background:var(--gold);color:#fff;font-size:17px}
#kp .kg .z{grid-column:1/3}
.pul{animation:pul 1.8s ease-in-out infinite}
.led-pulso #n,.led-pulso #qt,.led-pulso #p{animation:pul 2s ease-in-out infinite}
.led-fixo #n,.led-fixo #qt,.led-fixo #p{border-color:var(--g2);box-shadow:0 0 5px var(--g2)}
.led-arco #n,.led-arco #qt,.led-arco #p{animation:arco 4s linear infinite}
.led-piscar #n,.led-piscar #qt,.led-piscar #p{animation:pisca 1s steps(2) infinite}
.led-duplo #n,.led-duplo #qt,.led-duplo #p{animation:duplo 1.4s ease-in-out infinite alternate}
@keyframes pul{0%,100%{border-color:var(--g2);box-shadow:0 0 2px var(--g2)}50%{border-color:var(--g1);box-shadow:0 0 8px var(--g2)}}
@keyframes arco{0%,100%{border-color:#ff2d95;box-shadow:0 0 6px #ff2d95}20%{border-color:#ffb300;box-shadow:0 0 6px #ffb300}40%{border-color:#19e68a;box-shadow:0 0 6px #19e68a}60%{border-color:#00cfff;box-shadow:0 0 6px #00cfff}80%{border-color:#8b5cff;box-shadow:0 0 6px #8b5cff}}
@keyframes pisca{0%{border-color:var(--g2);box-shadow:0 0 6px var(--g2)}50%{border-color:transparent;box-shadow:none}}
@keyframes duplo{from{border-color:#ff2d95;box-shadow:0 0 6px #ff2d95}to{border-color:#00cfff;box-shadow:0 0 6px #00cfff}}
.hero{position:sticky;top:var(--hh,52px);z-index:20}
.st b small{font-size:.72em;font-weight:700;margin-right:3px;opacity:.8}
.st b{white-space:nowrap}
#cnt{background:var(--gold);color:#fff;padding:3px 10px;border-radius:10px;font-size:13px;font-weight:800}
#hit{display:grid;gap:6px}
.hi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:var(--fld);border:1px solid var(--g2);text-align:left}
.hi .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;min-width:0}
.hi .vl{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.chipm{padding:3px 10px;border-radius:10px;border:1px solid var(--g2);font-size:13px;font-weight:800;white-space:nowrap;color:var(--g2)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
const $=id=>document.getElementById(id),J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}},S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const OFF=()=>localStorage.offline_forcado=='1',ONL=()=>navigator.onLine&&!OFF();
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const M=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const K={c:'historico_compras_mensal',a:'historico_ticket_mensal',d:'historico_dinheiro_mensal',k:'catalogo_codigos_barras'};
const FILA='fila_fotos_ia',AC=()=>localStorage.auto_carrinho!='0';
const brl=n=>'R$ '+(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const SUG=['Arroz','Feijão Preto','Feijão Carioca','Açúcar','Café','Leite Integral','Leite Condensado','Creme de Leite','Biscoito','Óleo de Soja','Azeite','Macarrão','Molho de Tomate','Farinha de Trigo','Ovos','Manteiga','Pão Francês','Queijo Mussarela','Presunto','Iogurte','Peito de Frango','Carne Moída','Linguiça','Cebola','Alho','Tomate','Batata','Cenoura','Banana','Maçã','Detergente','Sabão em Pó','Amaciante','Água Sanitária','Papel Higiênico','Sabonete','Champô','Pasta de Dentes'];
